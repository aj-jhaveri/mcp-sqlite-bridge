name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # Read the version from .nvmrc so CI, local development, and the deploy host all
    # agree. This is not cosmetic: sqlite3 is a native module built per Node major, and
    # .nvmrc/engines pin 22.12.0 for exactly that reason (see 80be878). Hardcoding 20
    # here meant CI compiled and tested against a Node the service never runs, so the
    # binary-compatibility failure that pin exists to prevent could not be caught.
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version-file: '.nvmrc'
        cache: 'npm'

    # package-lock.json is generated by npm 11, but Node 22.12.0 bundles npm 10.9.0, and
    # the two disagree about optional transitives of @napi-rs/wasm-runtime — npm ci fails
    # with "Missing: @emnapi/runtime from lock file". Pinning npm to the version that
    # wrote the lockfile is what makes a reproducible install possible at all.
    - name: Setup npm
      run: npm install --global npm@11.6.2

    # npm ci installs exactly what package-lock.json specifies and fails on drift,
    # rather than silently resolving a different tree than the one committed.
    - name: Install dependencies
      run: npm ci

    - name: Build TypeScript code
      run: npm run build

    - name: Run test suite
      run: npm test
